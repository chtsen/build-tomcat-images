name: BUILD-YOZO-TOMCAT-IMAGES-4.19

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build for (e.g., linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64,linux/arm64'
      tag:
        description: 'Tag to build Docker image'
        required: false
        default: 'jdk17-4.20-260728'
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_ORG: chtsen
  DOCKER_ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  DOCKER_ALIYUN_ORG: chtsen-temp
  YOZO_IMAGE_NAME: yozo-tomcat

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
     
      # 登录镜像仓库
      - name: Login Docker Hub
        uses: docker/login-action@v1
        with:
        #这里引用的变量为上一步配置的变量
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PW }}    
          
      - name: Login to Aliyun Hub
        uses: docker/login-action@v2.2.0
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_ALIYUN_USER }}
          password: ${{ secrets.DOCKER_ALIYUN_PW }}
          
      - name: Modify file
        run: |
           sed -i s#IMAGE_TAG#${{ github.event.inputs.tag }}#g ./yozo-tomcat/4.20/Dockerfile
           sed -i s#IMAGE_TAG#${{ github.event.inputs.tag }}#g ./yozo-tomcat/Dockerfile_env
           sed -i s#IMAGE_TAG#${{ github.event.inputs.tag }}#g ./yozo-tomcat/Dockerfile_redis
           sed -i s#IMAGE_TAG#${{ github.event.inputs.tag }}#g ./yozo-tomcat/Dockerfile_sp
           sed -i s#IMAGE_TAG#${{ github.event.inputs.tag }}#g ./yozo-tomcat/Dockerfile_sp_redis

      - name: Build Push Skopeo Docker images
        run: |
          from_tag="${{ github.event.inputs.tag }}-uuid"
          image="${{ env.DOCKER_ORG }}/${{ env.YOZO_IMAGE_NAME }}:${from_tag}"
          
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"  -f yozo-tomcat/4.20/Dockerfile .
          skopeo copy --all  docker://${{ env.DOCKER_REGISTRY }}/"$image" docker://registry.cn-hangzhou.aliyuncs.com/chtsen-sysnc/${{ env.YOZO_IMAGE_NAME }}:${{ github.event.inputs.tag }}-uuid
          
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"-env  -f yozo-tomcat/Dockerfile_env .
          skopeo copy --all docker://${{ env.DOCKER_REGISTRY }}/"$image"-env docker://registry.cn-hangzhou.aliyuncs.com/chtsen-sysnc/${{ env.YOZO_IMAGE_NAME }}:${{ github.event.inputs.tag }}-uuid-env
          
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"-redis  -f yozo-tomcat/Dockerfile_redis .
          skopeo copy --all docker://${{ env.DOCKER_REGISTRY }}/"$image"-redis docker://registry.cn-hangzhou.aliyuncs.com/chtsen-sysnc/${{ env.YOZO_IMAGE_NAME }}:${{ github.event.inputs.tag }}-uuid-redis
          
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"-sp  -f yozo-tomcat/Dockerfile_sp .
          skopeo copy --all docker://${{ env.DOCKER_REGISTRY }}/"$image"-sp docker://registry.cn-hangzhou.aliyuncs.com/chtsen-sysnc/${{ env.YOZO_IMAGE_NAME }}:${{ github.event.inputs.tag }}-uuid-sp      
          
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"-sp-redis  -f yozo-tomcat/Dockerfile_sp_redis .
          skopeo copy --all docker://${{ env.DOCKER_REGISTRY }}/"$image"-sp-redis docker://registry.cn-hangzhou.aliyuncs.com/chtsen-sysnc/${{ env.YOZO_IMAGE_NAME }}:${{ github.event.inputs.tag }}-uuid-sp-redis
          

name: BUILD-YOZO-TOMCAT-IMAGES

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build for (e.g., linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64,linux/arm64'
      tag:
        description: 'Tag to build Docker image'
        required: false
        default: '9.0.98'
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_ORG: chtsen
  DOCKER_ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  DOCKER_ALIYUN_ORG: chtsen-temp
  IMAGE_NAME: yozo-tomcat

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
     
      # 登录镜像仓库
      - name: Login Docker Hub
        uses: docker/login-action@v1
        with:
        #这里引用的变量为上一步配置的变量
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PW }}    
          
      - name: Login to Aliyun Hub
        uses: docker/login-action@v2.2.0
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_ALIYUN_USER }}
          password: ${{ secrets.DOCKER_ALIYUN_PW }}

      - name: Build 和 Push Docker images
        run: |
          from_tag=${{ github.event.inputs.tag }}
          image="${{ env.DOCKER_REGISTRY }}\/${{ env.DOCKER_ORG }}\/{{ env.IMAGE_NAME }}:${from_tag}"
          
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"  -f yozo-tomcat/Dockerfile .
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"_env  -f yozo-tomcat/Dockerfile_env .
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"_redis  -f yozo-tomcat/Dockerfile_redis .
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"_sp  -f yozo-tomcat/Dockerfile_sp .
          docker buildx build --platform "${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}" --push -t "$image"_sp_redis  -f yozo-tomcat/Dockerfile_sp_redis .
